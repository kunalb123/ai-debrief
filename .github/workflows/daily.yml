name: Daily build

on:
  schedule:
    # 08:00 UTC every day. GitHub's scheduler can run late under load — that's
    # fine, the feed just needs to land some time in the morning.
    - cron: "0 8 * * *"
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      date:
        description: "Fetch a specific day (YYYY-MM-DD). Blank = today."
        required: false
        type: string

permissions:
  contents: read
  pages: write
  id-token: write

# Never let two deploys race; let a manual run cancel a queued cron run.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Fetch today's papers
        run: python scripts/fetch_papers.py ${{ inputs.date && format('--date {0}', inputs.date) || '' }}

      - name: Generate site
        run: python scripts/generate_site.py --out dist

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
