name: Daily build

on:
  schedule:
    # 08:00 UTC every day. GitHub's scheduler can run late under load — that's
    # fine, the feed just needs to land some time in the morning.
    - cron: "0 8 * * *"
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      date:
        description: "Fetch a specific day (YYYY-MM-DD). Blank = today."
        required: false
        type: string
      content:
        description: "Which feeds to publish."
        required: false
        default: mixed
        type: choice
        options: [mixed, papers, news]

permissions:
  contents: read
  pages: write
  id-token: write

# Runners are UTC, which puts a date on the masthead that hasn't happened yet
# for anyone west of Greenwich — at 11pm Pacific, UTC is already tomorrow. Both
# fetchers anchor their window to the machine's timezone, so setting it here is
# what makes the published feed agree with the reader's calendar. Change this to
# your own zone if you fork.
env:
  TZ: America/Los_Angeles

# Never let two deploys race; let a manual run cancel a queued cron run.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Fetch today's papers
        run: python scripts/fetch_papers.py ${{ inputs.date && format('--date {0}', inputs.date) || '' }}

      # Fifteen third-party feeds, any of which can be down at 08:00 UTC.
      # generate_site.py falls back to papers only when news.json is missing,
      # so a bad news day must not block the deploy.
      - name: Fetch AI industry news
        continue-on-error: true
        run: python scripts/fetch_news.py ${{ inputs.date && format('--date {0}', inputs.date) || '' }}

      - name: Generate site
        run: python scripts/generate_site.py --out dist --content ${{ inputs.content || 'mixed' }}

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
